# CI do opah-ledger.
#
# Propósito principal: provar publicamente, em máquina limpa, que o requisito
# obrigatório "código fonte deve compilar sem erros e warnings" está atendido.
#
# Esse requisito é eliminatório no desafio e é o mais fácil de violar por
# acidente — um SDK diferente, um analisador novo, um nullable esquecido.
# Deixar a verificação para a revisão manual na véspera é o pior momento
# possível, porque é quando o custo de errar é máximo.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build e testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar .NET SDK (versão do global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      # Estilo de código é verificado separadamente porque nem toda regra IDE
      # do .editorconfig é reportada por "dotnet build", mesmo com
      # EnforceCodeStyleInBuild. Sem este passo, build local e CI poderiam
      # discordar sobre o que é código válido — e isso foi descoberto na
      # prática, não previsto.
      - name: Verificar formatação e estilo
        run: dotnet format --verify-no-changes --verbosity minimal

      # -warnaserror é redundante com o TreatWarningsAsErrors do
      # Directory.Build.props, e está aqui de propósito: se alguém relaxar a
      # propriedade no csproj, o CI continua barrando.
      - name: Build (Release, warnings são erros)
        run: dotnet build --no-restore --configuration Release -warnaserror

      - name: Testes
        run: >
          dotnet test --no-build --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ${{ runner.temp }}/test-results

      - name: Publicar resultado dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ runner.temp }}/test-results
          if-no-files-found: ignore
          retention-days: 7
